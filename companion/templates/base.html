<!doctype html>
<html lang="{{ 'zh-Hans' if lang == 'zh' else 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Companion">
  <title>{% block title %}{{ T.app_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  {% block head %}{% endblock %}
</head>
<body data-page="{% block page %}{% endblock %}" class="{% block body_class %}{% endblock %}">
  {% include "_icons.html" %}
  <main class="screen" id="main">
    {% block body %}{% endblock %}
  </main>
  <div id="large-overlay" class="large-overlay" role="dialog" aria-modal="true" aria-labelledby="large-text" hidden>
    <p id="large-text" class="large-text" lang="it"></p>
    <button type="button" class="btn btn-plain" data-close-large>
      <svg class="ic" aria-hidden="true"><use href="#i-back"/></svg><span>{{ T.close }}</span>
    </button>
  </div>
  <script>
    window.T = {{ T|tojson }};
    window.CFG = {{ client_cfg|tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
